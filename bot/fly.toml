# Serves the crawler's Web Bot Auth key directory and its about page.
# The private key is the WEB_BOT_AUTH_KEY secret (fly secrets import -a oil-on-cotton-bot).

app = 'oil-on-cotton-bot'
primary_region = 'sjc'

[build]
  dockerfile = 'Dockerfile'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '5s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
