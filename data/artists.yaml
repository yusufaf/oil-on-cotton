# Artists whose work appears on pieces in the catalog, for the checklist's Artist column.
# src/lib/artists.ts matches a piece to an artist when one of the artist's keys appears in the
# piece's name as whole words, or equals one of its tags. Keys are the name, the aliases, and
# the titles of works at the piece's museum.
#
# - An alias goes in only when it cannot mean anything else in a clothing name ("Basquiat",
#   not "Thomas" or "Indiana").
# - A work goes in only when a piece names the work but not the artist, with a source showing
#   the title is that artist's work. It counts only at that museum.
# - Every artist has a Wikidata item, checked against its English label.
# - Sorted by surname.

