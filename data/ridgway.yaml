# One entry per Ridgway (1912) colour name used for a wall in data/museums.yaml.
# munsell: D. H. Hamly, "The Ridgway Color Standards with a Munsell Notation Key", JOSA
# 39(7):592-599 (1949), Table I, read from the page images of archive.org item
# sim_optical-society-of-america-journal_1949-07_39_7 (hamly.page is the journal page).
# Hamly's notations are 1929 Munsell Book of Color notations (p. 599, footnote 5); they are
# converted here as if they were renotations. See DESIGN.md, Colors.
# scans are cross-checks only, sampled with scripts/sample-scan.ts: shi is the Science History
# Institute copy, bhl is the Smithsonian Libraries copy digitised for the Biodiversity Heritage
# Library. box is [x, y, width, height] in pixels; deltaE is CIEDE2000 between the scan hex and
# the wall hex shipped for that name.

- name: Ox-blood Red
  munsell: "5R 2.4/10.0"
  hamly: { page: 597, plate: I }
  scans:
    - { at: shi, image: "https://digital.sciencehistory.org/downloads/deriv/q3hjfhg/download_full", box: [618,2429,244,118], hex: "#721521", deltaE: 4.2 }
    - { at: bhl, image: "https://archive.org/download/colorstandardsco00ridg/page/n60.jpg", box: [536,2924,307,147], hex: "#0E0303", deltaE: 26.5 }
- name: Dull Blackish Green
