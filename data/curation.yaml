# Hung works: public-domain artworks that hang in a room, each with a museum label listing the
# pieces made after it (DESIGN.md, hang-label). To hang a work:
#
# 1. Read the owning museum's collection record, never a shop page. Copy name, artistLine,
#    title, date, collection and accession as the record gives them (a year range takes an en
#    dash), set `record` to its URL and `checked` to the day you read it.
# 2. Use the owner's open-access image, and only if it is CC0. Save it in src/assets/hang/ at
#    1600px wide, and record `source`, `licence`, `credit` and `retrieved`. Every image the build
#    ships must be 200 KB or less; scripts/check-dist.ts checks it.
# 3. The `alt` says what the painting shows. The label already gives artist and title.
# 4. List each piece by its catalog id with a short `label` for the label. A curator opens the
#    piece's shop page in a browser, confirms it reproduces this exact work, and sets `verified`
#    to that day. Never fetch a shop page from a script.
#
# A piece that leaves the catalog drops off the label at build time, and a work with no pieces
# left stops hanging. To take down a work itself, delete its entry and its image file.
# Quote every date: test/curation.test.ts checks it. All label copy follows DESIGN.md.

