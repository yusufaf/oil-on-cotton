# One entry per museum shop. Terms verdicts come from reading each shop's terms
# and its museum's site terms; quote the clause that decided the verdict.
# Wall colours are Ridgway (1912) names; hex values are provisional ISCC-NBS
# centroids until they are recomputed from Hamly's 1949 Munsell key.

- id: getty
  shop: Getty Museum Store
  museum: J. Paul Getty Trust
  storeUrl: https://shop.getty.edu
  platform: shopify
  automation: auto
  affiliate: never
  apparelCollections: [apparel-accessories]
  terms:
    mainUrl: https://www.getty.edu/legal/terms-of-use/
    shopUrl: https://shop.getty.edu/policies/terms-of-service
    reviewedAt: "2026-10-25"
    verdict: listed-noncommercial
    clause: "(3) Using Site Content for commercial purposes is prohibited;"
  wall: { name: Ox-blood Red, hex: "#841B2D", source: iscc-nbs-centroid }

- id: whitney
  shop: Whitney Shop
  museum: Whitney Museum of American Art
  storeUrl: https://shop.whitney.org
  platform: shopify
