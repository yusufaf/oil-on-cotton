# One entry per museum shop. Terms verdicts come from reading each shop's terms
# and its museum's site terms; quote the clause that decided the verdict.
# Wall colours are Ridgway (1912) names. Each hex is Hamly's 1949 Munsell notation for
# that name (data/ridgway.yaml) converted to sRGB; deltaE is CIEDE2000 between the two.
# node scripts/walls-report.ts prints these lines.

- id: getty
  shop: Getty Museum Store
  museum: J. Paul Getty Trust
  storeUrl: https://shop.getty.edu
  platform: shopify
  automation: auto
  affiliate: never
  apparelCollections: [apparel-accessories]
  terms:
    mainUrl: https://www.getty.edu/legal/terms-of-use/
    shopUrl: https://shop.getty.edu/policies/terms-of-service
    reviewedAt: "2026-10-25"
    verdict: listed-noncommercial
    clause: "(3) Using Site Content for commercial purposes is prohibited;"
  wall: { name: Ox-blood Red, hex: "#780027", source: munsell-hamly-1949, munsell: "5R 2.4/10.0", deltaE: 0.1, text: on-wall-warm }

- id: whitney
  shop: Whitney Shop
  museum: Whitney Museum of American Art
  storeUrl: https://shop.whitney.org
  platform: shopify
  automation: auto
  affiliate: never
  apparelCollections: [apparel-accessories]
  terms:
    mainUrl: https://whitney.org/terms-and-conditions
    shopUrl: https://shop.whitney.org/policies/terms-of-service
    reviewedAt: "2026-10-25"
    verdict: listed-noncommercial
    clause: "You may not use the Materials for commercial purposes."
  wall: { name: Dull Blackish Green, hex: "#343F37", source: munsell-hamly-1949, munsell: "2.5G 2.5/1.5", deltaE: 0.5 }

